# Written only when the config file is missing. One point is both the floor
# and the ceiling. Kernels without the full OD patch reject a low floor such
# as 350 MHz. Replace this table with default-config.toml after checking
# pp_od_clk_voltage and the cooling.
safe-points = [
    { frequency = 1500, voltage = 775 },
]

[timing]
burst-samples = 20
ramp-up-samples = 64
ramp-down-samples = 256
intervals = { sample = 2000, adjust = 8000, finetune = 50000 }
ramp-rates = { burst = 1000, up = 50, up-medium = 25, up-slow = 10, up-crawl = 2, down = 0.2 }

[frequency-thresholds]
adjust = 100
finetune = 25

[load-target]
upper = 0.90
medium = 0.80
slow = 0.70
crawl = 0.60
lower = 0.40

[performance-mode]
enabled = true
control_file = "/tmp/bc250-max-performance"
check_interval = 500

[gpu]
pci_bus = 1  # PCI bus number of the AMD GPU (check with: lspci | grep -i vga)

[thermal]
monitor_interval = 1000
max_safe_temp = 85.0
emergency_temp = 95.0
fan_control_index = 1

[thermal.fan-control]
enabled = true
curve = [
    [50.0, 10],
    [55.0, 20],
    [60.0, 30],
    [65.0, 40],
    [70.0, 50],
    [75.0, 60],
    [80.0, 70],
    [85.0, 80],
    [90.0, 90],
    [95.0, 100],
]
