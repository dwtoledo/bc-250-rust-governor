safe-points = [
    { frequency = 350, voltage = 700 },
    { frequency = 860, voltage = 700 },
    { frequency = 1090, voltage = 700 },
    { frequency = 1280, voltage = 700 },
    { frequency = 1460, voltage = 750 },
    { frequency = 1620, voltage = 800 },
    { frequency = 1760, voltage = 850 },
    { frequency = 1890, voltage = 900 },
    { frequency = 2030, voltage = 950 },
    { frequency = 2090, voltage = 975 },
    { frequency = 2140, voltage = 1000 },
    { frequency = 2230, voltage = 1050 },
]

[timing]
burst-samples = 11
ramp-up-samples = 55
ramp-down-samples = 280
intervals = { sample = 1750, adjust = 9000, finetune = 45000 }
ramp-rates = { burst = 1000, up = 55, up-medium = 25, up-slow = 10, up-crawl = 2, down = 0.3 }

[frequency-thresholds]
adjust = 100
finetune = 25

[load-target]
upper = 0.90
medium = 0.82
slow = 0.70
crawl = 0.62
lower = 0.38

[performance-mode]
enabled = true
control_file = "/tmp/bc250-max-performance"
check_interval = 500

[gpu]
pci_bus = 1  # PCI bus number of the AMD GPU (check with: lspci | grep -i vga)

[thermal]
monitor_interval = 1000
max_safe_temp = 85.0
emergency_temp = 95.0
fan_control_index = 1

# If a section other than safe-points, or a key inside it, is omitted, the
# service fills it from the built-in config. That built-in copy uses the same
# timing, load, and fan values as this file.
# Set enabled = false to leave the fan alone.
[thermal.fan-control]
enabled = true
curve = [
    [50.0, 10],
    [55.0, 20],
    [60.0, 30],
    [65.0, 40],
    [70.0, 50],
    [75.0, 60],
    [80.0, 70],
    [85.0, 80],
    [90.0, 90],
    [95.0, 100],
]